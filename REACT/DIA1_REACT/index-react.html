<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Restaurante Marcos</title>
    <style>
        .disponible {
            color: black;
        }

        .agotado {
            color: red;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const platos = [
            { id: 1, nombre: "Lomo saltado", categoria: "segundos", precio: 18, stock: 3, disponible: true },
            { id: 2, nombre: "Arroz con pollo", categoria: "segundos", precio: 12, stock: 5, disponible: true },
            { id: 3, nombre: "Sopa de verduras", categoria: "entradas", precio: 8, stock: 0, disponible: false },
            { id: 4, nombre: "Pollo a la brasa", categoria: "segundos", precio: 20, stock: 4, disponible: true },
            { id: 5, nombre: "Jugo de naranja", categoria: "bebidas", precio: 5, stock: 8, disponible: true }
        ];

        function PlatoCard({ nombre, categoria, precio, stock, disponible }) {
            return (
                <div>
                    <h2>{nombre}</h2>
                    <p>Categoría: {categoria}</p>
                    <p>Precio: S/ {precio}</p>
                    <p>Stock: {stock}</p>
                    <p className={disponible ? "disponible" : "agotado"}>{disponible ? "✅ Disponible" : "❌ Agotado"}</p>
                </div>
            );
        }

        function Carta() {
            return (
                <div>
                    <h1>Carta del Restaurante</h1>

                    {platos.map(plato => (
                        <PlatoCard
                            key={plato.id}
                            nombre={plato.nombre}
                            categoria={plato.categoria}
                            precio={plato.precio}
                            stock={plato.stock}
                            disponible={plato.disponible}
                        />
                    ))}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<Carta />);

    </script>

</body>

</html>
